name: BloubIslandPOC
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BloubIsland:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: BloubIsland
      - path: Shared
    info:
      path: BloubIsland/Info.plist
      properties:
        CFBundleDisplayName: Bloub Avatar Lab
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Bloub Lab uses the microphone only when you explicitly start its audio-reactive animation experiment.
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bloub.island.poc
            CFBundleURLSchemes:
              - bloub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bloub.island.poc
        PRODUCT_NAME: BloubIsland
    dependencies:
      - target: BloubIslandWidget
        embed: true
      - target: BloubNotificationContent
        embed: true
  BloubIslandWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: BloubIslandWidget
      - path: Shared
    info:
      path: BloubIslandWidget/Info.plist
      properties:
        CFBundleDisplayName: Bloub Widgets
        CFBundleName: Bloub Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bloub.island.poc.widget
        PRODUCT_NAME: BloubIslandWidget
  BloubUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: BloubUITests
    dependencies:
      - target: BloubIsland
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bloub.island.poc.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BloubIsland
  BloubNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: BloubNotificationContent
    info:
      path: BloubNotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Bloub Animated Alert
        CFBundleName: Bloub Notification
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).BloubNotificationViewController"
          NSExtensionAttributes:
            UNNotificationExtensionCategory: BLOUB_DEMO
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionInitialContentSizeRatio: 0.73
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bloub.island.poc.notification
        PRODUCT_NAME: BloubNotificationContent
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  BloubIsland:
    build:
      targets:
        BloubIsland: all
  BloubSimulatorLab:
    build:
      targets:
        BloubIsland: all
    test:
      targets:
        - BloubUITests
