name: Build Bloub Island POC
on:
  workflow_dispatch:
  push:
    paths:
      - 'project.yml'
      - 'BloubIsland/**'
      - 'BloubIslandWidget/**'
      - 'BloubNotificationContent/**'
      - 'Shared/**'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  ios-unsigned:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project BloubIslandPOC.xcodeproj -scheme BloubIsland -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/BloubDerived" CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Verify compiled native app, widgets and Live Activity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          app = Path(os.environ["RUNNER_TEMP"]) / "BloubDerived/Build/Products/Release-iphoneos/BloubIsland.app"
          ext = app / "PlugIns/BloubIslandWidget.appex"
          notify = app / "PlugIns/BloubNotificationContent.appex"
          assert app.is_dir(), "Missing app bundle"
          assert ext.is_dir(), "Missing embedded widget"
          assert notify.is_dir(), "Missing notification content extension"
          with (app / "Info.plist").open("rb") as f: host = plistlib.load(f)
          with (ext / "Info.plist").open("rb") as f: widget = plistlib.load(f)
          with (notify / "Info.plist").open("rb") as f: rich = plistlib.load(f)
          for label, info in (("app", host), ("widget", widget), ("notification", rich)):
              assert isinstance(info.get("CFBundleDisplayName"), str) and info["CFBundleDisplayName"].strip(), f"{label}: missing CFBundleDisplayName (iOS install rejects this)"
              assert isinstance(info.get("CFBundleIdentifier"), str) and info["CFBundleIdentifier"].strip(), f"{label}: missing CFBundleIdentifier"
          assert rich.get("NSExtension",{}).get("NSExtensionPointIdentifier") == "com.apple.usernotifications.content-extension", "Invalid notification extension"
          assert rich.get("NSExtension",{}).get("NSExtensionAttributes",{}).get("UNNotificationExtensionCategory") == "BLOUB_DEMO", "Missing Bloub category"
          assert any(notify.glob("bloub-04-*.png")), "Missing notification sprite sheets"
          assert host.get("NSSupportsLiveActivities") is True, "Host lacks NSSupportsLiveActivities"
          assert widget.get("NSExtension",{}).get("NSExtensionPointIdentifier") == "com.apple.widgetkit-extension", "Invalid extension"
          assert any("bloub" in str(row).lower() for row in host.get("CFBundleURLTypes", [])), "Missing widget URL scheme"
          assert (app / "Assets.car").is_file(), "App asset catalog not built"
          assert (ext / "Assets.car").is_file(), "Widget asset catalog not built"
          print("PASS: Live Activity, Home/Lock widgets, Rich Notification content extension, sprite assets")
          print("App files:", sorted(p.name for p in app.iterdir())[:35])
          PY
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BloubDerived/Build/Products/Release-iphoneos/BloubIsland.app"
          test -d "$APP/PlugIns/BloubIslandWidget.appex"
          test -d "$APP/PlugIns/BloubNotificationContent.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BloubAvatarLab-v3-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BloubAvatarLab-v3-unsigned-IPA
          path: BloubAvatarLab-v3-unsigned.ipa
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
