name: Bloub Native iOS Simulator Lab

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/simulator-lab.yml'
      - 'BloubUITests/**'

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Native iPhone Simulator · UI tests + video + Appetize ZIP
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DERIVED: /tmp/BloubSimDerived
      ARTIFACT_DIR: ${{ github.workspace }}/sim-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Ensure Metal shader compiler is available
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent metalToolchain
          fi
          xcrun --find metal
          xcodebuild -version
      - name: Generate native Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build ARM64 Simulator app for Appetize
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          xcodebuild -project BloubIslandPOC.xcodeproj \
            -scheme BloubIsland -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BloubAppetizeDerived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build \
            > "$ARTIFACT_DIR/xcodebuild-appetize.log" 2>&1 || {
              tail -110 "$ARTIFACT_DIR/xcodebuild-appetize.log"
              exit 1
            }
          APP="$RUNNER_TEMP/BloubAppetizeDerived/Build/Products/Debug-iphonesimulator/BloubIsland.app"
          test -d "$APP/PlugIns/BloubIslandWidget.appex"
          test -d "$APP/PlugIns/BloubNotificationContent.appex"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
          cd "$(dirname "$APP")"
          zip -qr "$ARTIFACT_DIR/Bloub-Appetize-ARM64-Simulator.zip" "$(basename "$APP")"
          unzip -t "$ARTIFACT_DIR/Bloub-Appetize-ARM64-Simulator.zip" | tail -1
      - name: Upload Appetize-ready unsigned iOS Simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bloub-Appetize-ARM64-Simulator-Build
          path: sim-artifacts/Bloub-Appetize-ARM64-Simulator.zip
          if-no-files-found: error
          retention-days: 7
      - name: Choose available iPhone with Dynamic Island
        id: device
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          mkdir -p "$ARTIFACT_DIR"
          xcrun simctl list -j devices available > "$ARTIFACT_DIR/simulator-devices.json"
          # Prefer the user's iPhone 16 Pro when present. Current macos-26
          # images often only contain iPhone 17 Pro; prefer the oldest
          # installed iOS runtime to avoid repeated migration on fresh boot.
          DEVICE_ID=$(python3 - "$ARTIFACT_DIR/simulator-devices.json" <<'PY'
          import json, sys, re
          data=json.load(open(sys.argv[1], encoding="utf-8"))
          pool=[]
          for runtime, devices in data["devices"].items():
              numbers=[int(s) for s in re.findall(r"\d+", runtime)]
              for device in devices:
                  if device.get("isAvailable") and device.get("udid") and "iPhone" in device.get("name", ""):
                      pool.append((device["name"], numbers, runtime, device["udid"]))
          priorities=["iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro",
                      "iPhone 14 Pro", "iPhone 17", "iPhone 16", "iPhone 15"]
          pool.sort(key=lambda x:(priorities.index(x[0]) if x[0] in priorities else 99, x[1]))
          if not pool:
              raise SystemExit("NO_AVAILABLE_IPHONE_SIMULATOR")
          name, version, runtime, udid=pool[0]
          print(f"SIMULATOR_SELECTED={name}; OS={runtime}; UUID={udid}", file=sys.stderr)
          print(udid)
          PY
          )
          echo "udid=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          python3 - "$DEVICE_ID" <<'PY'
          import subprocess, sys
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"],
                             check=True, timeout=420)
          except subprocess.TimeoutExpired:
              print("ERROR: simulator failed to finish boot within 420s; aborting UI tests (infrastructure, not app)", flush=True)
              sys.exit(2)
          PY
          xcrun simctl list devices booted
          # A device visible to simctl is not necessarily accepted by Xcode.
          # Fail with actionable logs rather than launching blind (exit 70).
          SEEN=0
          for attempt in 1 2 3; do
            xcodebuild -project BloubIslandPOC.xcodeproj -scheme BloubSimulatorLab \
              -showdestinations > "$ARTIFACT_DIR/xcode-destinations.log" 2>&1 || true
            if grep -Fq "$DEVICE_ID" "$ARTIFACT_DIR/xcode-destinations.log"; then
              SEEN=1; break
            fi
            echo "Xcode cannot yet see $DEVICE_ID (attempt $attempt / 3)"
            sleep 12
          done
          cat "$ARTIFACT_DIR/xcode-destinations.log" | tail -45
          if [[ "$SEEN" != 1 ]]; then
            echo "::error::Simulator booted but Xcode does not expose it as a test destination"
            exit 3
          fi
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100 || true
      - name: Build + run native SwiftUI UI tests on iPhone Simulator
        id: test
        shell: bash
        run: |
          set +e  # Preserve xcodebuild's failure log and let the step report it.
          mkdir -p "$ARTIFACT_DIR"
          xcrun simctl io "${{ steps.device.outputs.udid }}" recordVideo --codec=h264 --force "$ARTIFACT_DIR/Bloub-native-simulator.mp4" > "$ARTIFACT_DIR/recording.log" 2>&1 &
          VIDEO_PID=$!
          sleep 3
          xcodebuild -project BloubIslandPOC.xcodeproj \
            -scheme BloubSimulatorLab -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.device.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$ARTIFACT_DIR/BloubUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test \
            > "$ARTIFACT_DIR/xcodebuild-test.log" 2>&1
          CODE=$?
          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true
          cat "$ARTIFACT_DIR/xcodebuild-test.log" | tail -140
          if [[ "$CODE" != 0 ]]; then echo "::error::Native XCTest failed with exit $CODE. Full xcodebuild-test.log is in the evidence artifact."; fi
          echo "test_exit=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"
      - name: Capture final simulator screenshot
        if: always()
        shell: bash
        run: |
          mkdir -p "$ARTIFACT_DIR"
          xcrun simctl io "${{ steps.device.outputs.udid }}" screenshot "$ARTIFACT_DIR/Bloub-final-screen.png" || true
      - name: Upload videos, screenshots, XCTest results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bloub-Native-Simulator-Evidence
          path: sim-artifacts/
          if-no-files-found: warn
          retention-days: 7
